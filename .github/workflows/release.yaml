name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (e.g. 1.2.3)"
        required: true

permissions:
  contents: write # Needed to create the tag and the release

env:
  SOURCE_BRANCH: main
  SEMVER: ${{ github.event.inputs.version }}

jobs:
  check_input:
    name: Validate User Input
    runs-on: ubuntu-latest
    steps:
      - name: Sanitize Version
        id: sanitize_version
        uses: stacks-sbtc/actions/github-script@ed353a33594a2fa97ea6702d838e4a935cce374d # main as of 2026-08-19
        with:
          script: |
            const version = "${{ env.SEMVER }}";
            const semverRegex = /^\d+\.\d+\.\d+$/;
            
            if (!semverRegex.test(version)) {
              core.setFailed(`Invalid version format: "${version}". Expected SemVer X.Y.Z`);
            } else {
              console.log(`Valid version: ${version}`);
              core.setOutput('version', version);
            }

  check_preconditions:
    name: Check Preconditions
    runs-on: ubuntu-latest
    needs: check_input
    outputs:
      release_sha: ${{ steps.resolve_release_sha.outputs.sha }}
    steps:
      - name: Checkout source branch (${{ env.SOURCE_BRANCH }})
        id: checkout_source_branch
        uses: stacks-sbtc/actions/checkout@ed353a33594a2fa97ea6702d838e4a935cce374d # main as of 2026-08-19
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      # Pin the release to the validated commit, so a later push to
      # the source branch cannot end up being tagged.
      - name: Resolve release commit
        id: resolve_release_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate Cargo.toml version
        id: validate_cargo_toml_version
        uses: stacks-sbtc/actions/github-script@ed353a33594a2fa97ea6702d838e4a935cce374d # main as of 2026-08-19
        with:
          script: |
            const version = '${{ env.SEMVER }}';            
            const fs = require('fs');
            const tomlFilePath = './Cargo.toml';

            try {
              const cargoToml = fs.readFileSync(tomlFilePath, 'utf-8');
              const packageSectionRegex = /\[package\][\s\S]*?version\s*=\s*"([^"]+)"/;
              const match = cargoToml.match(packageSectionRegex);

              if (!match) {
                core.setFailed(`Missing "package.version" in Cargo.toml`);
              } else {
                const pkg_version = match[1];

                if (pkg_version === version) {
                  console.log(`Cargo.toml contains version ${version}`);
                } else {
                  core.setFailed(`Version ${version} not matching "package.version" ${pkg_version} in Cargo.toml`);
                }
              }
            } catch (error) {
              core.setFailed(`Failed to read Cargo.toml: ${error.message}`);
            }

  do_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: 
      - check_input
      - check_preconditions
    steps:
      - name: Create tag on ${{ env.SOURCE_BRANCH }}
        id: create_tag
        uses: stacks-sbtc/actions/github-script@ed353a33594a2fa97ea6702d838e4a935cce374d # main as of 2026-08-19
        with:
          script: |
            const tag = 'v${{ env.SEMVER }}';
            const commit_sha = '${{ needs.check_preconditions.outputs.release_sha }}';

            console.log(`Tagging ${commit_sha} as ${tag}`);
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: commit_sha
            });

      - name: Create GitHub Release
        uses: stacks-sbtc/actions/github-script@ed353a33594a2fa97ea6702d838e4a935cce374d # main as of 2026-08-19
        with:
          script: |
            const version = `v${{ env.SEMVER }}`;
            const releaseDescription = `Release description for ${version}`;

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: version,
              body: releaseDescription,
              draft: false,
              prerelease: false,
               generate_release_notes: true
            });

            console.log(`Created draft release: ${release.data.html_url}`);
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
