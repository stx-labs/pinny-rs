name: CI

on:
    push:
        branches:
        - main

    # No branch filter: PRs (including from forks) can target any branch.
    pull_request:
        types: [opened, synchronize, reopened]

permissions: {}

# Key PR runs on the PR number: fork branch names (e.g. `main`) are not unique
# and could otherwise cancel each other or a push run on `main`.
# Only PR runs share a group and get cancelled; each push to `main` gets its own group.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXTEST_VERSION: 0.9.152
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
    lint:
        name: Run Lints
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout Repository
              id: checkout_Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Setup Rust
              id: setup_rust
              run: rustup toolchain install --no-self-update

            - name: Lint (Rustfmt)
              id: lint_rustfmt
              run: cargo pinny-fmt --check

            - name: Check Lockfile
              id: check_lockfile
              run: cargo fetch --locked

            - name: Check Build Without Dev Dependencies
              id: check_build_without_dev_dependencies
              run: cargo check --locked

            - name: Lint (Clippy)
              id: lint_clippy
              run: cargo pinny-clippy

    tests:
        name: Run Tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout Repository
              id: checkout_Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Setup Rust
              id: setup_rust
              run: rustup toolchain install --no-self-update

            - name: Install Nextest
              id: install_nextest
              uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
              with:
                tool: nextest@${{ env.NEXTEST_VERSION }}
                fallback: none

            - name: Execute Tests
              id: execute_tests
              run: cargo-nextest nextest run --locked --color always --no-fail-fast

    check:
        name: All Checks Passed
        runs-on: ubuntu-latest
        timeout-minutes: 5
        needs:
            - lint
            - tests
        steps:
            - run: echo "All checks passed!"
